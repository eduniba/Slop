<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramma commutativo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; color: #111; background: #fff; }
  #stage { position: relative; width: 100%; aspect-ratio: 580 / 360; border: 1px solid #ddd; border-radius: 10px; background: #fff; container-type: inline-size; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lbl { position: absolute; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; font-size: clamp(.8rem, 2.9cqw, 1.5rem); }
  .lbl.node { font-size: clamp(1rem, 4cqw, 2rem); }

  h3 { margin: 1.2rem 0 .4rem; font-size: 1rem; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .7rem; padding: .35rem 0; border-bottom: 1px solid #eee; }
  .row .name { width: 9.5rem; font-size: .85rem; }
  .row input[type=text] { flex: 1 1 14rem; font-family: monospace; padding: 4px 6px; min-width: 0; }
  .sw { display: flex; gap: 4px; }
  .sw button { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #bbb; padding: 0; cursor: pointer; }
  .sw button.sel { box-shadow: 0 0 0 2px #111; }
  .flip, #exp { padding: 4px 10px; cursor: pointer; }
  .dim { opacity: .45; }
  #expNote { font-size: .8rem; color: #555; margin-left: .6rem; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 1.2rem; align-items: start; }
  .left { position: sticky; top: 1rem; }
  .right h3:first-child { margin-top: 0; }
  .row .name { width: auto; flex: 1; }
  .row input[type=text] { flex: 1 1 100%; order: 2; }
  .sw { order: 3; flex-wrap: wrap; }
  .flip { order: 1; }
  .sqlbl { order: 1; font-size: .8rem; white-space: nowrap; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } .left { position: static; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="left">
    <div id="stage"><svg id="svg" viewBox="60 30 580 360"></svg><div id="labels"></div></div>
    <div style="margin-top:.8rem">
      <button id="exp" type="button">Copia diagramma</button>
      <label style="font-size:.85rem;margin-left:.6rem"><input type="checkbox" id="transp"> sfondo trasparente</label>
      <span id="expNote"></span>
    </div>
  </div>
  <div class="right">
    <h3>Insiemi</h3>
    <div id="nodeRows"></div>
    <h3>Frecce</h3>
    <div id="edgeRows"></div>
  </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const PAL = ["#000000", "#ff0000", "#0000d8", "#15803d", "#ea580c", "#7e22ce", "#6b7280", "#ff00ff", "#32cd32", "#00c8c8", "#ff69b4"];
  const HW = 48, HH = 30;
  const VB = { x: 60, y: 30, w: 580, h: 360 };
  const pos = { tl: [150, 90], tr: [550, 90], bl: [150, 330], br: [550, 330] };

  const nodes = {
    tl: { name: "Alto sinistra",  on: true, label: "V_{\\mathcal{B}}", color: PAL[0] },
    tr: { name: "Alto destra",    on: true, label: "V_{\\mathcal{B}}", color: PAL[0] },
    bl: { name: "Basso sinistra", on: true, label: "V_{\\mathcal{E}}", color: PAL[0] },
    br: { name: "Basso destra",   on: true, label: "V_{\\mathcal{E}}", color: PAL[0] }
  };

  const edges = {
    top:    { name: "Freccia alta",     a: "tl", b: "tr", rev: false, on: true,  off: [0, -26], sq: false,
              label: "\\mathcal{M}^{\\mathcal{B}}_{\\mathcal{B}}(T)", color: PAL[1] },
    bottom: { name: "Freccia bassa",    a: "bl", b: "br", rev: false, on: true,  off: [0, 26], sq: false,
              label: "\\mathcal{M}^{\\mathcal{E}}_{\\mathcal{E}}(T)", color: PAL[3] },
    left:   { name: "Freccia sinistra", a: "tl", b: "bl", rev: false, on: true,  off: [-46, 0],
              label: "\\mathcal{M}^{\\mathcal{B}}_{\\mathcal{E}}", color: PAL[2] },
    right:  { name: "Freccia destra",   a: "tr", b: "br", rev: true,  on: true,  off: [46, 0],
              label: "\\mathcal{M}^{\\mathcal{E}}_{\\mathcal{B}}", color: PAL[2] },
    diag1:  { name: "Diagonale ↘↖",    a: "tl", b: "br", rev: false, on: false, diag: true, shift: -1,
              label: "\\mathcal{M}^{\\mathcal{E}}_{\\mathcal{B}}(T)", color: PAL[5] },
    diag2:  { name: "Diagonale ↗↙",    a: "bl", b: "tr", rev: false, on: false, diag: true, shift: 1,
              label: "\\mathcal{M}^{\\mathcal{B}}_{\\mathcal{E}}(T)", color: PAL[4] }
  };

  const svg = document.getElementById("svg");
  const labels = document.getElementById("labels");

  function addLabel(x, y, tex, color, cls) {
    const d = document.createElement("div");
    d.className = "lbl " + cls;
    d.style.left = ((x - VB.x) / VB.w * 100) + "%";
    d.style.top = ((y - VB.y) / VB.h * 100) + "%";
    d.style.color = color;
    katex.render(tex, d, { throwOnError: false });
    labels.appendChild(d);
  }

  // Freccia "quadrata": percorso equivalente che passa dall'altra riga di insiemi
  function squaredPath(k, e) {
    const top = k === "top";
    const A = e.rev ? e.b : e.a, B = e.rev ? e.a : e.b;   // partenza, arrivo
    const inset = top ? 28 : 42;
    const xs = pos[A][0] + (pos[A][0] < 350 ? inset : -inset);
    const xe = pos[B][0] + (pos[B][0] < 350 ? inset : -inset);
    const g = n => (nodes[n].on ? HH + 10 : 10);
    const dir = top ? 1 : -1;
    const ys = pos[A][1] + dir * g(A);
    const ye = pos[B][1] + dir * g(B);
    const yh = top ? pos.bl[1] - HH - 22 : pos.tl[1] + HH + 22;
    const up = top ? -1 : 1;              // verso di arrivo sull'asse y
    const base = ye - up * 13;
    return `<path d="M${xs},${ys} L${xs},${yh} L${xe},${yh} L${xe},${base + up * 2}" fill="none" stroke="${e.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`
         + `<polygon points="${xe},${ye} ${xe + 6},${base} ${xe - 6},${base}" fill="${e.color}"/>`;
  }

  function render() {
    let s = "";
    labels.innerHTML = "";
    const bothDiag = edges.diag1.on && edges.diag2.on;

    for (const k in nodes) {
      const n = nodes[k];
      if (n.on) addLabel(pos[k][0], pos[k][1], n.label, n.color, "node");
    }

    for (const k in edges) {
      const e = edges[k];
      if (e.sq) s += squaredPath(k, e);
      if (!e.on) continue;
      const A = e.rev ? e.b : e.a, B = e.rev ? e.a : e.b;
      const pa = pos[A], pb = pos[B];
      const dx = pb[0] - pa[0], dy = pb[1] - pa[1];
      const len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const exit = n => nodes[n].on
        ? Math.min(HW / (Math.abs(ux) || 1e-9), HH / (Math.abs(uy) || 1e-9)) + 8
        : 8;
      const ga = exit(A), gb = exit(B);
      const sx = pa[0] + ux * ga, sy = pa[1] + uy * ga;
      const ex = pb[0] - ux * gb, ey = pb[1] - uy * gb;
      const px = -uy, py = ux;
      const L = 13, Wd = 6;
      const bx = ex - ux * L, by = ey - uy * L;
      s += `<line x1="${sx}" y1="${sy}" x2="${bx + ux * 2}" y2="${by + uy * 2}" stroke="${e.color}" stroke-width="2.6" stroke-linecap="round"/>`;
      s += `<polygon points="${ex},${ey} ${bx + px * Wd},${by + py * Wd} ${bx - px * Wd},${by - py * Wd}" fill="${e.color}"/>`;

      if (e.diag) {
        // etichetta centrata sulla freccia e spostata sotto di essa
        let mx = (sx + ex) / 2, my = (sy + ey) / 2;
        if (bothDiag) {
          // con entrambe le diagonali attive le separo lungo la retta per non sovrapporle
          const cx = (pos[e.b][0] - pos[e.a][0]) / len, cy = (pos[e.b][1] - pos[e.a][1]) / len;
          mx += e.shift * 0.2 * len * cx;
          my += e.shift * 0.2 * len * cy;
        }
        let nx = -uy, ny = ux;
        if (ny < 0) { nx = -nx; ny = -ny; }
        addLabel(mx + nx * 24, my + ny * 24, e.label, e.color, "");
      } else {
        addLabel((sx + ex) / 2 + e.off[0], (sy + ey) / 2 + e.off[1], e.label, e.color, "");
      }
    }
    svg.innerHTML = s;
  }

  // ---------- Copia diagramma come immagine ----------
  async function snapshot() {
    await document.fonts.ready;
    const transp = document.getElementById("transp").checked;
    const canvas = await html2canvas(document.getElementById("stage"), {
      scale: 3,
      backgroundColor: transp ? null : "#ffffff",
      onclone: doc => {
        const st = doc.getElementById("stage");
        st.style.border = "none";
        st.style.borderRadius = "0";
        if (transp) st.style.background = "transparent";
      }
    });
    return new Promise(res => canvas.toBlob(res, "image/png"));
  }

  document.getElementById("exp").onclick = async () => {
    const note = document.getElementById("expNote");
    note.textContent = "…";
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": snapshot() })]);
      note.textContent = "Copiato: incolla con Ctrl/Cmd+V.";
    } catch (err) {
      try {
        const blob = await snapshot();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "diagramma.png";
        a.click();
        note.textContent = "Appunti non disponibili: ho scaricato il PNG.";
      } catch (e2) {
        note.textContent = "Errore: " + e2.message;
      }
    }
  };

  // ---------- Pannello controlli ----------
  function buildRow(container, obj, isEdge) {
    const row = document.createElement("div");
    row.className = "row";

    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = obj.on;

    const name = document.createElement("span");
    name.className = "name"; name.textContent = obj.name;

    const inp = document.createElement("input");
    inp.type = "text"; inp.value = obj.label; inp.spellcheck = false;

    const sw = document.createElement("div");
    sw.className = "sw";
    const btns = PAL.map(c => {
      const b = document.createElement("button");
      b.style.background = c; b.title = c; b.type = "button";
      b.onclick = () => { obj.color = c; mark(); render(); };
      sw.appendChild(b);
      return b;
    });

    function mark() { btns.forEach((b, i) => b.classList.toggle("sel", PAL[i] === obj.color)); }
    function dim() { row.classList.toggle("dim", !obj.on && !obj.sq); }

    cb.onchange = () => { obj.on = cb.checked; dim(); render(); };
    inp.oninput = () => { obj.label = inp.value; render(); };

    row.append(cb, name, inp, sw);

    if (isEdge) {
      const f = document.createElement("button");
      f.type = "button"; f.className = "flip"; f.textContent = "⇄ inverti";
      f.onclick = () => { obj.rev = !obj.rev; render(); };
      row.appendChild(f);
      if ("sq" in obj) {
        const sl = document.createElement("label");
        sl.className = "sqlbl";
        const sc = document.createElement("input");
        sc.type = "checkbox"; sc.checked = obj.sq;
        sc.onchange = () => { obj.sq = sc.checked; dim(); render(); };
        sl.append(sc, " freccia quadrata");
        row.appendChild(sl);
      }
    }

    mark(); dim();
    container.appendChild(row);
  }

  for (const k in nodes) buildRow(document.getElementById("nodeRows"), nodes[k], false);
  for (const k in edges) buildRow(document.getElementById("edgeRows"), edges[k], true);

  render();
});
</script>
</body>
</html>
